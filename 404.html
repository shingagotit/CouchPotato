<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CouchPotato - Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .redirecting {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍿 CouchPotato</div>
        <div class="message">Loading your streaming platform...</div>
        <div class="spinner"></div>
        <div class="redirecting">Please wait while we redirect you to the correct page.</div>
    </div>
    
    <script>
        // Get the current path and redirect to the React app
        const currentPath = window.location.pathname;
        const basePath = '/CouchPotato/';
        
        // If we're not already at the base path, redirect to it
        if (!currentPath.startsWith(basePath)) {
            window.location.replace(basePath);
        } else {
            // If we're at the base path, let the React app handle routing
            window.location.replace(basePath);
        }
    </script>
</body>
</html>
