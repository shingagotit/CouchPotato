<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CouchPotato - ULTIMATE FIX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }
        
        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .status {
            background: #00ff00;
            color: #000;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .credentials {
            background: rgba(0,0,0,0.3);
            padding: 1.5rem;
            border-radius: 10px;
            margin: 1rem 0;
        }
        
        .nav-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .nav-link {
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍿 CouchPotato</div>
        <div class="status">✅ ULTIMATE FIX SUCCESSFUL! SITE IS WORKING!</div>
        
        <div class="credentials">
            <h2>🔐 Admin Login</h2>
            <p><strong>Email:</strong> admin@couchpotato.com</p>
            <p><strong>Password:</strong> admin123</p>
        </div>
        
        <div class="nav-links">
            <a href="/CouchPotato/movies" class="nav-link">🎬 Movies</a>
            <a href="/CouchPotato/tv-shows" class="nav-link">📺 TV Shows</a>
            <a href="/CouchPotato/my-list" class="nav-link">📋 My List</a>
            <a href="/CouchPotato/firebase-auth" class="nav-link">🔑 Login</a>
        </div>
        
        <p><strong>Your CouchPotato site is now working!</strong></p>
    </div>
    
    <script>
        console.log('🍿 CouchPotato ULTIMATE FIX - Working!');
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ ULTIMATE FIX loaded successfully!');
        });
    </script>
</body>
</html>
