<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CouchPotato - Premium Streaming Experience</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }
        .logo {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .loading {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍿 CouchPotato</div>
        <div class="subtitle">Premium Streaming Experience</div>
        <div class="message">Loading your streaming platform...</div>
        <div class="spinner"></div>
        <div class="loading">Please wait while we initialize the application.</div>
    </div>
    
    <script>
        // Handle routing for GitHub Pages
        const path = window.location.pathname;
        
        // If accessing a specific route, redirect to main app
        if (path.includes('/auth') || path.includes('/firebase-auth') || path.includes('/app')) {
            // Let the React app handle the routing
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        } else {
            // Load the main React application
            setTimeout(() => {
                window.location.reload();
            }, 2000);
        }
    </script>
</body>
</html>
